<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10141c"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'self'; form-action 'none'; connect-src 'none'; worker-src 'none'; manifest-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'"><base href="/practice-files/"><title>IHS Practice Files</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{--bone:#f3eee4;--bone2:#ebe4d6;--ink:#111;--muted:#5a574e;--navy:#10141c;--mint:#7fe0b8}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bone);background-image:linear-gradient(rgba(16,20,28,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(16,20,28,.045) 1px,transparent 1px);background-size:24px 24px}nav{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--bone);padding:10px 16px}.navin{max-width:960px;margin:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{margin-right:auto}.brand b{color:var(--mint);letter-spacing:.13em}.brand span{margin-left:9px}nav a{color:var(--bone);text-decoration:none;padding:10px 12px;min-height:44px;border-radius:999px}nav a.active{background:var(--mint);color:var(--navy)}main,footer{max-width:960px;margin:auto;padding:20px 16px}h1,h2,h3{font-family:Georgia,"Times New Roman",Times,serif}.card{background:var(--bone2);padding:18px;border-radius:12px;margin-bottom:16px}.notice{border-left:5px solid var(--navy)}button{min-height:44px;border:1px solid var(--ink);border-radius:999px;padding:10px 17px;background:var(--navy);color:var(--mint);font-weight:700;cursor:pointer}.secondary{background:var(--bone2);color:var(--ink)}.danger{background:var(--ink);color:var(--bone)}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:5px}input,select{width:100%;min-height:44px;padding:9px;border:1px solid var(--ink);border-radius:8px;background:var(--bone);font:inherit}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.drop{border:2px dashed var(--navy);padding:28px;text-align:center;border-radius:12px}.file,.case{display:grid;grid-template-columns:1.3fr .6fr 2fr auto;gap:9px;padding:10px 0;border-bottom:1px solid rgba(17,17,17,.25);align-items:center}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:var(--navy);color:var(--mint);font-size:.8rem}.error{font-weight:700;border:2px solid var(--ink);padding:10px;border-radius:8px}.muted,small{color:var(--muted)}footer{font-size:.9rem;border-top:1px solid var(--ink)}:focus-visible{outline:2px solid var(--navy);outline-offset:2px}.hide{display:none!important}@media(max-width:800px){.grid,.file,.case{grid-template-columns:1fr}.brand{width:100%}}</style></head>
<body><nav><div class="navin"><div class="brand"><b>IHS</b><span>Practice Files</span></div><a href="#/connect">Connect</a><a href="#/intake">Intake</a><a href="#/queue">Queue</a></div></nav><main id="app"></main><footer><p><strong>Public website shell. Do not enter patient names, initials, DOB, identifying chart numbers, or other patient identifiers.</strong></p><p><strong>Use only the practice's non-patient Case ID.</strong></p><p><strong>This app is not HIPAA certified and does not claim HIPAA compliance.</strong></p></footer>
<script>(()=>{'use strict';
const app=document.querySelector('#app'),DB='ihs-files-v1',STORE='handles',KEY='practiceRoot',buckets=['scans','notes','design','print'];let root=null,granted=false,queue=[],ignored=[],scannedAt=null,files=[],collisions=new Map(),message='',scanning=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const validCase=v=>{v=v.trim();return v.length>=1&&v.length<=80&&v!=='.'&&v!=='..'&&!/[\\/<>:"|?*\x00-\x1f\x7f]/.test(v)&&!/[. ]$/.test(v)&&!/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\..*)?$/i.test(v)};function realDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d}function maxDate(){const d=new Date();d.setDate(d.getDate()+1);return localDate(d)}function supported(){return typeof window.showDirectoryPicker==='function'&&window.isSecureContext===true&&!matchMedia('(max-width: 800px)').matches}function privacy(){return `<div class="card notice"><p>Files never leave this computer. This page is only the tool.</p><p>Nothing is uploaded to GitHub, IHS Drive, or any server.</p><p>Chrome: connect a practice folder on this PC. You may need to grant access again.</p><p>File and folder names can contain patient information. They stay on disk and are never logged, synced, or analyzed.</p></div>`}function shell(title,html){app.innerHTML=`<h1>${title}</h1>${message?`<div class="card">${esc(message)}</div>`:''}${privacy()}${html}`;message=''}function note(s){message=s;render()}
function dbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function dbGet(){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE),q=t.objectStore(STORE).get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);t.oncomplete=()=>db.close()})}async function dbPut(v){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,KEY);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}async function dbForget(){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(KEY);t.oncomplete=()=>{db.close();res()};t.onerror=()=>rej(t.error)})}
function route(){let h=location.hash;if(!['#/connect','#/intake','#/queue'].includes(h)){h='#/connect';location.hash=h}document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===h));render()}function render(){const links=document.querySelectorAll('nav a');if(!supported()){links.forEach(a=>a.classList.toggle('hide',a.getAttribute('href')!=='#/connect'));app.innerHTML=`<h1>Unsupported browser</h1><div class="card error"><strong>Practice Files requires current desktop Chrome and a secure page. Files cannot be organized from this browser.</strong></div><div class="card notice"><p>Files never leave this computer. This page is only the tool.</p><p>Nothing is uploaded to GitHub, IHS Drive, or any server.</p><p>File and folder names can contain patient information. They stay on disk and are never logged, synced, or analyzed.</p></div>`;return}links.forEach(a=>a.classList.remove('hide'));({'#/connect':connectView,'#/intake':intakeView,'#/queue':queueView}[location.hash]||connectView)()}
function demo(){return `<div class="card notice"><strong>DEMO ONLY — fake Case IDs. Not a real case list. Connect a practice folder to work with local files.</strong></div>${['DEMO-0001|2026-01-15','DEMO-0002|2026-01-16'].map(x=>{const [c,d]=x.split('|');return `<div class="card"><h3>${c}</h3><p>${d}</p><p>Scans 0 · Notes 0 · Design 0 · Print 0</p><button class="secondary" data-demo="${c}">Open case in app</button></div>`}).join('')}<div id="demoPanel"></div>`}function bindDemo(){document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{const p=document.querySelector('#demoPanel');p.innerHTML=`<div class="card"><h2>${esc(b.dataset.demo)}</h2>${buckets.map(x=>`<p><strong>${x[0].toUpperCase()+x.slice(1)} (0)</strong></p><ul></ul>`).join('')}</div>`;p.scrollIntoView({behavior:'smooth'})})}
function connectView(){shell('Connect practice folder',`${root?`<div class="card"><p>Folder: <strong>${esc(root.name)}</strong></p><p>Permission: <strong>${granted?'Granted':'Reconnect required'}</strong></p><div class="row"><button id="connect">${granted?'Connect practice folder':'Reconnect folder'}</button><button id="forget" class="danger">Forget folder on this browser</button></div></div>`:`<div class="card"><button id="connect">Connect practice folder</button></div>${demo()}`}<div class="card notice">Forgetting the folder only removes this browser's saved connection. It does not delete files.</div>`);document.querySelector('#connect').onclick=choose;if(root)document.querySelector('#forget').onclick=forget;bindDemo()}
async function choose(){try{let h;if(root&&!granted){const p=await root.requestPermission({mode:'readwrite'});if(p==='granted'){granted=true;await scan();note('Folder access restored.');return}note('Access denied. Use Reconnect folder and grant read and write access.');return}h=await window.showDirectoryPicker({mode:'readwrite'});await dbPut(h);root=h;granted=(await h.queryPermission({mode:'readwrite'}))==='granted';if(granted){await scan();note('Practice folder connected.')}else note('Access denied. Use Reconnect folder and grant read and write access.')}catch(e){if(e&&e.name==='AbortError')note('Folder picker canceled.');else note('Could not connect the practice folder.')}}async function forget(){if(!confirm("Forgetting the folder only removes this browser's saved connection. It does not delete files."))return;try{await dbForget();root=null;granted=false;queue=[];ignored=[];files=[];collisions.clear();note('Folder connection forgotten. Files were not deleted.')}catch(e){note('Could not forget the folder connection.')}}
function intakeView(){const enabled=root&&granted;shell('Intake files',`<div class="card grid"><div><label for="caseId">Case ID (practice work-order number)</label><input id="caseId" maxlength="80" autocomplete="off"><small>Do not enter patient names, initials, DOB, or chart numbers.</small><div id="caseError"></div></div><div><label for="visit">Visit date</label><input id="visit" type="date" min="2000-01-01" max="${maxDate()}" value="${localDate()}"></div><div><label for="appliance">Appliance type</label><select id="appliance"><option value="">Select</option>${['nightguard','retainer','aligner','crown','bridge','denture','splint','other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label for="bucket">Destination bucket</label><select id="bucket"><option value="">Select</option>${buckets.map(x=>`<option value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><div class="full"><label for="picker">Files</label><input id="picker" type="file" multiple ${enabled?'':'disabled'}><div id="drop" class="drop" aria-disabled="${enabled?'false':'true'}">${enabled?'Drop files, not folders.':'Connect a practice folder to enable file drop.'}</div><p>Choose files to copy into the connected practice folder. Nothing is uploaded.</p></div></div>${!enabled?'<div class="card error">Connect a practice folder to save files.</div>':''}<div id="review" class="card"><h2>Review before write</h2><p>No files selected.</p></div>`);const c=document.querySelector('#caseId'),p=document.querySelector('#picker'),drop=document.querySelector('#drop');c.oninput=()=>{document.querySelector('#caseError').textContent=c.value&&!validCase(c.value)?'Case ID must be the practice work-order number only — one folder-safe name. Do not use patient names, initials, DOB, or chart numbers.':'';review()};c.onblur=()=>{c.value=c.value.trim();review()};['visit','appliance','bucket'].forEach(id=>document.querySelector('#'+id).onchange=review);p.onchange=()=>{if(enabled)addFiles([...p.files])};drop.ondragover=e=>{if(enabled)e.preventDefault()};drop.ondrop=e=>{e.preventDefault();if(!enabled)return;const list=[...e.dataTransfer.items],hasDir=list.some(i=>{const x=i.webkitGetAsEntry&&i.webkitGetAsEntry();return x&&x.isDirectory});if(hasDir){note('Drop files, not folders.');return}addFiles([...e.dataTransfer.files])};review()}
function addFiles(a){if(files.length+a.length>100){message='Select 100 files or fewer.';render();return}const good=[];let err='';for(const f of a){if(f.size===0)err='This file is empty and was not copied.';else if(f.size>512*1024*1024)err='This file is larger than 512 MB and was not copied.';else good.push(f)}files.push(...good);if(err)message=err;review()}
function size(n){if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(1)} KB`;return `${(n/1048576).toFixed(1)} MB`}async function getDest(create=false){let h=root;h=await h.getDirectoryHandle(document.querySelector('#caseId').value.trim(),{create});h=await h.getDirectoryHandle(document.querySelector('#visit').value,{create});return h.getDirectoryHandle(document.querySelector('#bucket').value,{create})}async function exists(dir,name){try{await dir.getFileHandle(name);return true}catch(e){if(e.name==='NotFoundError')return false;throw e}}
async function review(){const box=document.querySelector('#review');if(!box)return;collisions.clear();let dir=null;if(root&&granted&&validCase(document.querySelector('#caseId').value)&&realDate(document.querySelector('#visit').value)&&document.querySelector('#bucket').value){try{dir=await getDest(false)}catch(e){if(e.name!=='NotFoundError'){permissionLost(e);return}}}if(dir)for(const f of files)try{collisions.set(f,await exists(dir,f.name))}catch(e){permissionLost(e);return}const collision=[...collisions.values()].some(Boolean),valid=granted&&validCase(document.querySelector('#caseId').value)&&realDate(document.querySelector('#visit').value)&&document.querySelector('#visit').value>='2000-01-01'&&document.querySelector('#visit').value<=maxDate()&&document.querySelector('#appliance').value&&document.querySelector('#bucket').value&&files.length;box.innerHTML=`<h2>Review before write</h2>${files.length?files.map((f,i)=>`<div class="file"><strong>${esc(f.name)}</strong><span>${size(f.size)}</span><span>${esc(document.querySelector('#caseId').value.trim())}/${esc(document.querySelector('#visit').value)}/${esc(document.querySelector('#bucket').value)}/${esc(f.name)}</span><span>${collisions.get(f)?'<span class="badge">Collision</span>':''}<button class="danger" data-remove="${i}">Remove</button></span></div>`).join(''):'<p>No files selected.</p>'}${collision?`<fieldset><legend>Files already exist</legend><label><input style="width:auto" type="radio" name="collision" value="skip"> Skip files that already exist</label><label><input style="width:auto" type="radio" name="collision" value="suffix"> Save with suffix \` (2)\`</label></fieldset>`:''}<button id="save" ${valid&&!collision?'':'disabled'}>Save to practice folder</button>`;box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{files.splice(Number(b.dataset.remove),1);review()});box.querySelectorAll('[name=collision]').forEach(r=>r.onchange=()=>document.querySelector('#save').disabled=!valid);document.querySelector('#save').onclick=saveBatch}
function splitName(n){const i=n.lastIndexOf('.');return i>0?[n.slice(0,i),n.slice(i)]:[n,'']}async function freeName(dir,n){if(!await exists(dir,n))return n;const [stem,ext]=splitName(n);for(let i=2;;i++){const c=`${stem} (${i})${ext}`;if(!await exists(dir,c))return c}}
async function saveBatch(){const total=files.length,choice=document.querySelector('[name=collision]:checked')?.value||'',failed=[],succeeded=new Set();let skipped=0,ok=0,wrote=false;try{const dir=await getDest(true);for(const f of files){try{let name=f.name;if(await exists(dir,name)){if(choice==='skip'){skipped++;continue}name=await freeName(dir,name)}const h=await dir.getFileHandle(name,{create:true});let w=null,closed=false;try{w=await h.createWritable();await w.write(f);await w.close();closed=true;ok++;wrote=true;succeeded.add(f)}finally{if(w&&!closed)try{await w.close()}catch(_){}}}catch(e){failed.push(f)}}files=files.filter(f=>!succeeded.has(f));message=`Saved ${ok} of ${total}. ${skipped} skipped. ${failed.length} failed.`;if(wrote)await scan();render()}catch(e){permissionLost(e)}}
function permissionLost(){granted=false;queue=[];note('Access denied. Use Reconnect folder and grant read and write access. Disk is untouched.')}
async function scan(){if(!root||!granted||scanning)return;scanning=true;const out=[],bad=[];try{for await(const ce of root.values()){if(ce.kind!=='directory'||!validCase(ce.name)){bad.push(ce.name);continue}const visits=[];for await(const ve of ce.values()){if(ve.kind!=='directory'||!realDate(ve.name)){bad.push(ve.name);continue}const counts={scans:0,notes:0,design:0,print:0},found={scans:[],notes:[],design:[],print:[]};for await(const be of ve.values()){if(be.kind!=='directory'||!buckets.includes(be.name)){bad.push(be.name);continue}for await(const fe of be.values()){if(fe.kind==='file'){const f=await fe.getFile();counts[be.name]++;found[be.name].push({name:fe.name,size:f.size})}else bad.push(fe.name)}}visits.push({date:ve.name,counts,files:found})}visits.sort((a,b)=>b.date.localeCompare(a.date));out.push({caseId:ce.name,visits})}out.sort((a,b)=>a.caseId.localeCompare(b.caseId));queue=out;ignored=bad;scannedAt=new Date();scanning=false}catch(e){scanning=false;permissionLost(e)}}
function queueView(){if(!root||!granted){shell('Queue',`${demo()}<div class="card notice">External folder changes appear after Refresh from disk; this app does not watch continuously.</div>`);bindDemo();return}shell('Queue',`<div class="card notice">External folder changes appear after Refresh from disk; this app does not watch continuously.</div><div class="card row"><span>${scannedAt?`Last scanned ${scannedAt.toLocaleTimeString('en-US')}`:'Not scanned yet'}</span><button id="refresh" class="secondary">Refresh from disk</button></div>${queue.length?queue.map((c,i)=>`<div class="card case"><strong>${esc(c.caseId)}</strong><span>${c.visits.length} visit(s)</span><span>${c.visits.map(v=>`${v.date}: ${buckets.map(b=>`${b} ${v.counts[b]}`).join(' · ')}`).join('<br>')}</span><button data-open="${i}" class="secondary">Open case in app</button></div>`).join(''):'<div class="card">No files were found in the expected case folders. Refresh after files are added.</div>'}${ignored.length?`<div class="card"><h2>Ignored folders (unexpected name or layout)</h2><ul>${ignored.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}<div id="casePanel"></div>`);document.querySelector('#refresh').onclick=async()=>{await scan();render()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(Number(b.dataset.open)))}function openCase(i){const c=queue[i],p=document.querySelector('#casePanel');p.innerHTML=`<div class="card"><h2>${esc(c.caseId)}</h2>${c.visits.map(v=>`<h3>${v.date}</h3>${buckets.map(b=>`<p><strong>${b[0].toUpperCase()+b.slice(1)} (${v.counts[b]})</strong></p><ul>${v.files[b].map(f=>`<li>${esc(f.name)} — ${size(f.size)}</li>`).join('')}</ul>`).join('')}`).join('')}</div>`;p.scrollIntoView({behavior:'smooth'})}
async function init(){if(!supported()){route();return}try{root=await dbGet();if(root){granted=(await root.queryPermission({mode:'readwrite'}))==='granted';if(granted)await scan()}}catch(e){message='Could not read the saved folder connection.'}route()}window.addEventListener('hashchange',route);window.addEventListener('resize',render);document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&root&&granted){await scan();render()}});init();
})();</script></body></html>
